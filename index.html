<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e54e9);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    /* Background glow */
    body::before {
      content: "";
      position: fixed;
      width: 350px;
      height: 350px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      filter: blur(80px);
      top: -100px;
      left: -100px;
    }

    body::after {
      content: "";
      position: fixed;
      width: 300px;
      height: 300px;
      background: rgba(255,220,100,0.18);
      border-radius: 50%;
      filter: blur(80px);
      bottom: -100px;
      right: -80px;
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(90%, 600px);
      padding: 45px 25px;
      text-align: center;
      border-radius: 30px;
      background: rgba(255,255,255,0.16);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 25px 60px rgba(0,0,0,0.25);
      animation: cardIn 1.2s ease;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: scale(0.7) translateY(40px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .emoji {
      font-size: 75px;
      animation: bounce 1.8s infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0) rotate(-5deg);
      }
      50% {
        transform: translateY(-15px) rotate(5deg);
      }
    }

    h1 {
      margin-top: 15px;
      font-size: clamp(42px, 10vw, 75px);
      font-weight: 900;
      line-height: 1;
      text-shadow:
        0 0 10px rgba(255,255,255,0.8),
        0 0 25px rgba(255,255,255,0.5);
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #fff;
      }
      to {
        text-shadow:
          0 0 10px #fff,
          0 0 30px #ffe66d,
          0 0 50px #ff9f43;
      }
    }

    .name {
      margin-top: 12px;
      font-size: clamp(25px, 6vw, 42px);
      font-weight: 700;
      color: #ffe66d;
    }

    .message {
      margin: 20px auto;
      max-width: 480px;
      font-size: clamp(16px, 4vw, 20px);
      line-height: 1.6;
    }

    .cake {
      font-size: 65px;
      margin: 15px 0;
      animation: cakeFloat 2s ease-in-out infinite;
    }

    @keyframes cakeFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    button {
      border: none;
      padding: 15px 30px;
      border-radius: 50px;
      font-size: 17px;
      font-weight: bold;
      color: #8e2de2;
      background: white;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 35px rgba(0,0,0,0.3);
    }

    button:active {
      transform: scale(0.95);
    }

    /* Confetti */
    .confetti {
      position: fixed;
      top: -20px;
      width: 10px;
      height: 18px;
      z-index: 10;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* Balloons */
    .balloon {
      position: fixed;
      bottom: -100px;
      font-size: 55px;
      animation: balloonUp 8s linear infinite;
      opacity: 0.8;
      z-index: 1;
    }

    @keyframes balloonUp {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(-120vh);
      }
    }

    @media (max-width: 500px) {
      .card {
        padding: 35px 18px;
        border-radius: 25px;
      }

      .emoji {
        font-size: 60px;
      }

      .cake {
        font-size: 55px;
      }

      button {
        width: 85%;
        padding: 14px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- Birthday Card -->
  <div class="card">

    <div class="emoji">🥳</div>

    <h1>Happy Birthday!</h1>

    <!-- Change the name here -->
    <div class="name">Dear Birthday Star ✨</div>

    <div class="cake">🎂</div>

    <p class="message">
      Wishing you a day filled with happiness, laughter,
      love and beautiful memories. May all your dreams
      come true and your year ahead be absolutely amazing! 💖
    </p>

    <button onclick="celebrate()">
      🎉 Celebrate! 🎉
    </button>

  </div>

  <script>

    const colors = [
      "#ff4757",
      "#ffd32a",
      "#05c46b",
      "#18dcff",
      "#ff6bcb",
      "#ffffff",
      "#a55eea"
    ];

    function createConfetti(amount = 120) {

      for (let i = 0; i < amount; i++) {

        const confetti = document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left =
          Math.random() * 100 + "vw";

        confetti.style.backgroundColor =
          colors[Math.floor(Math.random() * colors.length)];

        confetti.style.width =
          Math.random() * 8 + 5 + "px";

        confetti.style.height =
          Math.random() * 12 + 8 + "px";

        confetti.style.animationDuration =
          Math.random() * 3 + 2 + "s";

        confetti.style.animationDelay =
          Math.random() * 1.5 + "s";

        confetti.style.transform =
          `rotate(${Math.random() * 360}deg)`;

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 6000);
      }
    }

    function createBalloons() {

      const balloons = ["🎈", "🎈", "🎈", "🎈"];

      balloons.forEach((balloon, index) => {

        const element = document.createElement("div");

        element.classList.add("balloon");

        element.innerHTML = balloon;

        element.style.left =
          (10 + index * 25) + "%";

        element.style.animationDelay =
          (index * 2) + "s";

        document.body.appendChild(element);

      });
    }

    function celebrate() {

      createConfetti(250);

      // Button effect
      const button = document.querySelector("button");

      button.innerHTML = "🎊 Happy Birthday! 🎊";

      setTimeout(() => {
        button.innerHTML = "🎉 Celebrate! 🎉";
      }, 3000);
    }

    // Start animations
    createConfetti(100);
    createBalloons();

    // Continuous light confetti
    setInterval(() => {
      createConfetti(20);
    }, 4000);

  </script>

</body>
</html>
